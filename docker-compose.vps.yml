services:
  db:
    image: postgres:16-alpine
    container_name: skanderbeg-gateway-db
    restart: always
    environment:
      POSTGRES_DB: skanderbeg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  skanderbeg-gateway:
    image: ghcr.io/phinfire/skanderbeg-gateway:latest
    container_name: skanderbeg-gateway
    restart: always
    environment:
      BASE_API_URL: ${BASE_API_URL:-http://skanderbeg.pm/api.php}
      API_PORT: ${API_PORT:-8085}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skanderbeg
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID}
    ports:
      - "${API_PORT:-8085}:8000"
    volumes:
      - cache_volume:/app/cache
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cache_volume:
  db_volume:
