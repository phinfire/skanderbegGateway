services:
  db:
    image: postgres:16-alpine
    container_name: skanderbeg-gateway-db-dev
    environment:
      POSTGRES_DB: skanderbeg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  skanderbeg-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: skanderbeg-gateway-dev
    environment:
      BASE_API_URL: ${BASE_API_URL:-http://skanderbeg.pm/api.php}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skanderbeg
      ADMIN_DISCORD_ID: ${ADMIN_DISCORD_ID}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - cache_volume:/app/cache
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  cache_volume:
  db_volume:
